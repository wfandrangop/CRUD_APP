<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agregar estudiante</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<main class="page">
  <section class="card form-card">
    <h1>Agregar estudiante</h1>
    <p class="muted">Completa el formulario para guardar un nuevo estudiante.</p>

    <form th:action="@{/students}" th:object="${student}" method="post">
      <div class="field">
        <label for="name">Nombre</label>
        <input id="name" type="text" th:field="*{name}" required>
      </div>

      <div class="field">
        <label for="lastName">Apellido</label>
        <input id="lastName" type="text" th:field="*{lastName}" required>
      </div>

      <div class="field">
        <label for="age">Edad</label>
        <input id="age" type="number" min="1" th:field="*{age}" required>
      </div>

      <div class="actions">
        <button class="btn btn-primary" type="submit">Guardar</button>
        <a class="btn" th:href="@{/students}">Cancelar</a>
      </div>
    </form>
  </section>
</main>
</body>
</html>
